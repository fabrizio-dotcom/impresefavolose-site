name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Rebuild pages and confirm they match what is committed
        run: |
          python3 tools/build.py
          git diff --exit-code -- site || (echo "site/ is out of date: run python3 tools/build.py and commit" && exit 1)
      - name: Health and safety check
        run: python3 tools/check.py
